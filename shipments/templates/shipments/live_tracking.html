{% extends 'shipments/base.html' %}
{% load static %}
{% block title %}Live tracking · FreightFlow{% endblock %}
{% block head_extra %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
    #map { height: calc(100vh - 90px); width: 100%; border-radius: 6px; }
</style>
{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-2">
    <h1 class="h4 mb-0">Live truck tracking</h1>
    <span class="text-muted small">Polling <code>/api/telemetry/latest/</code> every 3 seconds</span>
</div>
<div id="map"></div>
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="{% static 'shipments/js/live_tracking.js' %}"></script>
{% endblock %}
